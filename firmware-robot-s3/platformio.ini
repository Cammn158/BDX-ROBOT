; ============================================================================
; BDX-Mini Droid Firmware Configuration (ESP32-S3 N16R8)
; Framework: Arduino on top of ESP-IDF
; ============================================================================

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Cấu hình bộ nhớ chuẩn cho chip ESP32-S3 N16R8 (16MB Quad Flash + 8MB Octal PSRAM)
board_build.arduino.memory_type = qio_opi
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -I include

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

; Thư viện cốt lõi cho OLED I2C (0x3C), PCA9685 (0x40) và Giao thức WebSocket/JSON
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit SSD1306 @ ^2.5.13
    bblanchon/ArduinoJson @ ^7.2.1
    links2004/WebSockets @ ^2.6.1
